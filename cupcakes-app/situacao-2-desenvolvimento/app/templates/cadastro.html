{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required minlength="2" autocomplete="name">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required autocomplete="email">
  <label for="telefone">Telefone (opcional)</label>
  <input id="telefone" name="telefone" type="tel" autocomplete="tel">
  <label for="senha">Senha (mínimo 6 caracteres)</label>
  <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
  <button class="btn" type="submit">Criar conta</button>
</form>
{% endblock %}
