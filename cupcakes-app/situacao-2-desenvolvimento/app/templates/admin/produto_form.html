{% extends "base.html" %}
{% block titulo %}{{ 'Editar sabor' if produto else 'Cadastrar sabor' }}{% endblock %}
{% block conteudo %}
<h1>{{ 'Editar sabor' if produto else 'Cadastrar sabor' }}</h1>
<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required value="{{ produto['nome'] if produto else '' }}">
  <label for="descricao">Descrição</label>
  <textarea id="descricao" name="descricao" rows="3">{{ produto['descricao'] if produto else '' }}</textarea>
  <label for="preco">Preço em reais</label>
  <input id="preco" name="preco" inputmode="decimal" required placeholder="12,50"
         value="{{ ('%.2f' % (produto['preco_centavos']/100))|replace('.', ',') if produto else '' }}">
  <label for="cor_glace">Cor do glacê</label>
  <input id="cor_glace" name="cor_glace" type="color" value="{{ produto['cor_glace'] if produto else '#A3214F' }}">
  <button class="btn" type="submit">Salvar sabor</button>
</form>
{% endblock %}
